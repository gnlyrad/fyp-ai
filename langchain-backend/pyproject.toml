[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-backend"
version = "0.1.0"
description = "Gemini + FAISS retrieval over the MAS compliance PDF corpus."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "boto3>=1.43.89",
    "python-dotenv>=1.0",
    "langchain>=1.3.18",
    "langchain-google-genai>=4.2,<5",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "faiss-cpu>=1.8.0",
    "pypdf>=5.0.0",
    "pydantic>=2.10",
]

[tool.setuptools]
packages = ["langchain_backend"]
