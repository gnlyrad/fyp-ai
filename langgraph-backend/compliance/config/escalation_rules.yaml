# Deterministic escalation rules, evaluated in order by `nodes/decide.py`.
# `when` conditions supported by decide.py:
#   red_flag_severity: <low|medium|high>   -> fires if any red flag has this severity
#   item: <checklist id>, status: <Status> -> fires if that item has this status
- id: high_red_flag
  when: {red_flag_severity: high}
  escalate: true
  hold: true
  reason: "A high-severity red flag was identified during the call."

- id: medium_red_flag
  when: {red_flag_severity: medium}
  escalate: true
  hold: false
  reason: "A medium-severity red flag was identified during the call."

- id: c04_fail
  when: {item: C04, status: FAIL}
  escalate: false
  hold: true
  reason: "The discussed product failed the eligibility check."

- id: c01_fail
  when: {item: C01, status: FAIL}
  escalate: true
  hold: false
  reason: "Caller identity or authority could not be confirmed."
