<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Evaluation</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #677084; --border: #e2e5eb;
    --pass: #2f9e6b; --partial: #d9a21b; --fail: #d64545; --na: #9aa3b2; --cd: #7b61c4;
    --accent: #2f6fdb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171d; --card: #1c2029; --text: #e6e9ef; --muted: #98a1b3; --border: #2c3240; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  header h1 { font-size: 18px; margin: 0 auto 0 0; }
  select, button { font: inherit; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text); }
  main { padding: 20px 24px; max-width: 1400px; margin: 0 auto; }
  h2 { font-size: 15px; margin: 28px 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; overflow-x: auto; }
  .stat .label { color: var(--muted); font-size: 12px; }
  .stat .value { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .sub { color: var(--muted); font-size: 12px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .bar { display: flex; height: 14px; border-radius: 4px; overflow: hidden; min-width: 160px; background: var(--border); }
  .bar span { display: block; height: 100%; }
  .s-PASS { background: var(--pass); } .s-PARTIAL { background: var(--partial); } .s-FAIL { background: var(--fail); }
  .s-NOT_APPLICABLE { background: var(--na); } .s-CANNOT_DETERMINE { background: var(--cd); }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 12px; color: #fff; }
  .ok { color: var(--pass); } .bad { color: var(--fail); } .muted { color: var(--muted); }
  .hbar { height: 8px; background: var(--accent); border-radius: 4px; }
  .cm td { text-align: center; } .cm td.diag { font-weight: 700; }
  #detail { position: fixed; inset: 0 0 0 auto; width: min(760px, 100%); background: var(--card); border-left: 1px solid var(--border);
            overflow-y: auto; padding: 20px; box-shadow: -8px 0 24px rgba(0,0,0,.15); display: none; }
  #detail.open { display: block; }
  #detail pre { white-space: pre-wrap; font-size: 12px; background: var(--bg); padding: 10px; border-radius: 6px; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  @media (max-width: 600px) { header, main { padding-left: 16px; padding-right: 16px; } .two { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Compliance pipeline evaluation</h1>
  <label>Tag <select id="f-tag"><option value="">All</option></select></label>
  <label>Model <select id="f-model"><option value="">All</option></select></label>
  <label>Call <select id="f-call"><option value="">All</option></select></label>
  <button id="refresh">Refresh</button>
</header>
<main id="app"><div class="empty">Loading…</div></main>
<aside id="detail"></aside>

<script>
const STATUSES = ["PASS", "PARTIAL", "FAIL", "NOT_APPLICABLE", "CANNOT_DETERMINE"];
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (r) => r && r.rate != null ? `${(r.rate * 100).toFixed(0)}%` : "–";
const frac = (r) => r && r.total ? `${r.hits}/${r.total}` : "";
const num = (v, d = 2) => v == null ? "–" : Number(v).toFixed(d);

function params() {
  const p = new URLSearchParams();
  if ($("f-tag").value) p.set("tag", $("f-tag").value);
  if ($("f-model").value) p.set("model", $("f-model").value);
  if ($("f-call").value) p.set("call_id", $("f-call").value);
  return p.toString();
}

async function api(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  return res.json();
}

function fillSelect(el, values) {
  const current = el.value;
  el.innerHTML = '<option value="">All</option>' + values.map((v) => `<option>${esc(v)}</option>`).join("");
  el.value = values.includes(current) ? current : "";
}

function stat(label, value, sub = "") {
  return `<div class="card stat"><div class="label">${esc(label)}</div><div class="value">${value}</div><div class="sub">${esc(sub)}</div></div>`;
}

function statusBar(counts) {
  const total = STATUSES.reduce((s, k) => s + (counts[k] || 0), 0) || 1;
  return `<div class="bar" title="${STATUSES.map((s) => `${s}: ${counts[s] || 0}`).join("\n")}">` +
    STATUSES.map((s) => counts[s] ? `<span class="s-${s}" style="width:${(counts[s] / total) * 100}%"></span>` : "").join("") + "</div>";
}

const legend = `<div class="legend">${STATUSES.map((s) => `<span><i class="s-${s}"></i>${s}</span>`).join("")}</div>`;

function countTable(title, obj) {
  const entries = Object.entries(obj || {});
  if (!entries.length) return `<div class="card"><b>${esc(title)}</b><p class="muted">none</p></div>`;
  const max = Math.max(...entries.map(([, v]) => v));
  return `<div class="card"><b>${esc(title)}</b><table>` + entries.map(([k, v]) =>
    `<tr><td>${esc(k)}</td><td style="width:50%"><div class="hbar" style="width:${(v / max) * 100}%"></div></td><td>${v}</td></tr>`).join("") + "</table></div>";
}

function renderAccuracy(acc, names) {
  if (!acc) return `<h2>Accuracy vs expected</h2><div class="card muted">No runs matched a fixture with an <code>expected.json</code>. Run <code>scripts/score_fixtures.py</code>, then upload <code>output/fixtures</code>.</div>`;
  const labels = acc.confusion_matrix.labels.filter((l) => l !== "?" || acc.confusion_matrix.matrix["?"] ||
    Object.values(acc.confusion_matrix.matrix).some((r) => r["?"]));
  const cm = `<table class="cm"><tr><th>expected ↓ / actual →</th>${labels.map((l) => `<th>${esc(l)}</th>`).join("")}</tr>` +
    labels.map((e) => `<tr><th>${esc(e)}</th>${labels.map((a) => {
      const v = (acc.confusion_matrix.matrix[e] || {})[a] || 0;
      return `<td class="${e === a ? "diag" : ""}" style="${v ? `background:color-mix(in srgb, var(${e === a ? "--pass" : "--fail"}) ${Math.min(15 + v * 6, 60)}%, transparent)` : ""}">${v || ""}</td>`;
    }).join("")}</tr>`).join("") + "</table>";
  const perItem = `<table><tr><th>Item</th><th>Name</th><th>Accuracy</th><th></th></tr>` +
    Object.entries(acc.per_item_accuracy).map(([id, r]) =>
      `<tr><td>${esc(id)}</td><td class="muted">${esc(names[id] || "")}</td><td>${pct(r)} <span class="muted">${frac(r)}</span></td>
       <td style="width:40%"><div class="hbar" style="width:${(r.rate || 0) * 100}%;background:${r.rate >= 0.8 ? "var(--pass)" : r.rate >= 0.5 ? "var(--partial)" : "var(--fail)"}"></div></td></tr>`).join("") + "</table>";
  const mark = (m) => m ? '<span class="ok">✓</span>' : '<span class="bad">✗</span>';
  const perRun = `<table><tr><th>Call</th><th>Model</th><th>Tag</th><th>Items</th><th>Intent</th><th>Escalation</th><th>Actions</th><th>Red flags</th></tr>` +
    acc.per_run.map((r) => `<tr class="clickable" data-id="${esc(r._id)}"><td>${esc(r.call_id)}</td><td>${esc(r.model)}</td><td>${esc(r.tag ?? "")}</td>
      <td>${pct(r.item_accuracy)} <span class="muted">${frac(r.item_accuracy)}</span></td>
      <td>${mark(r.score.call_intent.match)} <span class="muted">${esc(r.score.call_intent.actual ?? "null")}</span></td>
      <td>${mark(r.score.escalation.match)}</td><td>${mark(r.score.action_types.match)}</td><td>${mark(r.score.red_flag_categories.match)}</td></tr>`).join("") + "</table>";
  return `<h2>Accuracy vs expected <span class="muted">(${acc.scored_runs} scored run${acc.scored_runs === 1 ? "" : "s"})</span></h2>
    <div class="grid">
      ${stat("Item accuracy", pct(acc.overall_item_accuracy), frac(acc.overall_item_accuracy))}
      ${stat("Call intent accuracy", pct(acc.call_intent_accuracy), frac(acc.call_intent_accuracy))}
      ${stat("Escalation accuracy", pct(acc.escalation_accuracy), frac(acc.escalation_accuracy))}
      ${stat("Action-type recall", pct(acc.action_type_recall), "runs with all expected actions")}
      ${stat("Red-flag recall", pct(acc.red_flag_recall), "runs with all expected categories")}
    </div>
    <div class="two" style="margin-top:16px">
      <div class="card"><b>Per-item accuracy</b>${perItem}</div>
      <div class="card"><b>Status confusion matrix</b> <span class="muted">(first acceptable expected status)</span>${cm}</div>
    </div>
    <div class="card" style="margin-top:16px"><b>Per-run scores</b>${perRun}</div>`;
}

function render(metrics, runs) {
  const op = metrics.operational;
  if (!op.runs) { $("app").innerHTML = `<div class="empty">No runs found. Upload outputs with <code>python evaluation/upload_outputs.py</code>.</div>`; return; }
  const names = metrics.item_names || {};
  const perItem = `<table><tr><th>Item</th><th>Name</th><th>Status distribution</th><th>Avg conf</th><th>n</th></tr>` +
    Object.entries(op.per_item).map(([id, v]) => `<tr><td>${esc(id)}</td><td class="muted">${esc(names[id] || "")}</td>
      <td>${statusBar(v.statuses)}</td><td>${num(v.avg_confidence)}</td><td>${v.total}</td></tr>`).join("") + "</table>";
  const runTable = `<table><tr><th>Call</th><th>Generated</th><th>Model</th><th>Tag</th><th>Intent</th><th>Statuses</th><th>Review</th><th>Escalate</th><th>Red flags</th><th>Errors</th><th>Accuracy</th></tr>` +
    runs.map((r) => `<tr class="clickable" data-id="${esc(r._id)}"><td>${esc(r.call_id)}</td><td class="muted">${esc((r.generated_at || "").slice(0, 16).replace("T", " "))}</td>
      <td>${esc(r.model)}</td><td>${esc(r.tag ?? "")}</td><td>${esc(r.call_intent ?? "–")}</td><td>${statusBar(r.counts)}</td>
      <td>${r.needs_review ? "yes" : "no"}</td><td>${r.escalated ? '<span class="bad">yes</span>' : "no"}</td>
      <td>${r.red_flags}</td><td>${r.errors ? `<span class="bad">${r.errors}</span>` : 0}</td>
      <td>${r.item_accuracy ? pct(r.item_accuracy) : '<span class="muted">–</span>'}</td></tr>`).join("") + "</table>";

  $("app").innerHTML = `
    <h2>Overview</h2>
    <div class="grid">
      ${stat("Runs", op.runs, Object.keys(op.models).length + " model(s)")}
      ${stat("Needs review", pct(op.needs_review), frac(op.needs_review))}
      ${stat("Escalated", pct(op.escalated), frac(op.escalated))}
      ${stat("Hold transaction", pct(op.hold_transaction), frac(op.hold_transaction))}
      ${stat("Avg confidence", num(op.avg_confidence), "across all items")}
      ${stat("Verified items", pct(op.verified_items), frac(op.verified_items))}
      ${stat("Warnings / run", num(op.avg_warnings_per_run, 1), "")}
      ${stat("Runs with errors", pct(op.runs_with_errors), frac(op.runs_with_errors))}
    </div>
    ${renderAccuracy(metrics.accuracy, names)}
    <h2>Status distribution</h2>
    <div class="card">${legend}<div style="margin-bottom:12px">${statusBar(op.status_totals)}</div>${perItem}</div>
    <h2>Breakdown</h2>
    <div class="two">
      ${countTable("Call intent", op.call_intents)}
      ${countTable("Models", op.models)}
      ${countTable("Quality flags", op.quality_flags)}
      ${countTable("Actions by owner", op.actions_by_owner)}
      ${countTable("Red flags by severity", op.red_flags_by_severity)}
      ${countTable("Red flags by category", op.red_flags_by_category)}
    </div>
    <h2>Runs</h2>
    <div class="card">${runTable}</div>`;
  document.querySelectorAll("tr.clickable").forEach((tr) => tr.addEventListener("click", () => openDetail(tr.dataset.id)));
}

async function openDetail(id) {
  const run = await api(`/api/runs/${encodeURIComponent(id)}`);
  const score = run.score;
  const names = Object.fromEntries((run.checklist || []).map((c) => [c.id, c.name]));
  const rows = (run.results || []).map((r) => {
    const s = score && score.items[r.item_id];
    return `<tr><td>${esc(r.item_id)}</td><td class="muted">${esc(names[r.item_id] || "")}</td>
      <td><span class="pill s-${esc(r.status)}">${esc(r.status)}</span></td>
      <td>${s ? `${s.match ? '<span class="ok">✓</span>' : '<span class="bad">✗</span>'} <span class="muted">${esc(s.expected.join(" / "))}</span>` : ""}</td>
      <td>${num(r.confidence)}</td><td>${r.verified ? "yes" : ""}</td><td>${(r.warnings || []).length || ""}</td></tr>
      <tr><td></td><td colspan="6" class="muted" style="white-space:normal">${esc(r.reasoning)}</td></tr>`;
  }).join("");
  const list = (title, items, fmt) => `<h2>${title} (${(items || []).length})</h2>` +
    ((items || []).length ? `<ul>${items.map((i) => `<li>${fmt(i)}</li>`).join("")}</ul>` : '<p class="muted">none</p>');
  $("detail").innerHTML = `
    <button onclick="document.getElementById('detail').classList.remove('open')" style="float:right">Close</button>
    <h1 style="font-size:18px;margin:0">${esc(run.call_id)}</h1>
    <p class="muted">${esc(run.model?.id)} · ${esc(run.generated_at)} · ${esc(run.source_file)}${run.tag ? " · tag " + esc(run.tag) : ""}</p>
    <p>Intent: <b>${esc(run.call_intent?.category ?? "undetermined")}</b>${score ? ` (expected ${esc(score.call_intent.expected)})` : ""} ·
       Escalation: <b>${run.escalation?.required ? "required" : "no"}</b>${score ? ` (expected ${score.escalation.expected ? "required" : "no"})` : ""}</p>
    ${run.expected?.description ? `<p class="muted" style="white-space:normal">${esc(run.expected.description)}</p>` : ""}
    <h2>Items</h2><table><tr><th>Item</th><th>Name</th><th>Status</th><th>Expected</th><th>Conf</th><th>Verified</th><th>Warn</th></tr>${rows}</table>
    ${list("Actions", run.actions, (a) => `[${esc(a.owner_role)}] <b>${esc(a.action_type)}</b>: ${esc(a.description)}`)}
    ${list("Red flags", run.red_flags, (f) => `[${esc(f.severity)}/${esc(f.category)}] ${esc(f.description)}`)}
    ${list("Review reasons", run.summary?.review_reasons, esc)}
    ${list("Errors", run.errors, esc)}
    <h2>Transcript</h2><pre>${esc(run.transcript)}</pre>`;
  $("detail").classList.add("open");
}

async function load() {
  try {
    const f = await api("/api/filters");
    fillSelect($("f-tag"), f.tags); fillSelect($("f-model"), f.models); fillSelect($("f-call"), f.call_ids);
    const q = params();
    const [metrics, runs] = await Promise.all([api(`/api/metrics?${q}`), api(`/api/runs?${q}`)]);
    render(metrics, runs);
  } catch (err) {
    $("app").innerHTML = `<div class="empty bad">Failed to load: ${esc(err.message)}</div>`;
  }
}

["f-tag", "f-model", "f-call"].forEach((id) => $(id).addEventListener("change", load));
$("refresh").addEventListener("click", load);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("detail").classList.remove("open"); });
load();
</script>
</body>
</html>
